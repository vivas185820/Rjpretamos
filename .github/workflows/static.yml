<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RJ Préstamos | Soluciones Financieras</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1b5e20;
            --secondary: #2d7a4d;
            --accent: #c0ca33;
            --bg: #fdfdfd;
            --white: #ffffff;
            --text: #1e293b;
            --shadow: 0 20px 50px rgba(0,0,0,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: var(--text); overflow-x: hidden; }

        /* --- HEADER --- */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 6%; background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid #f1f5f9;
        }
        .logo { font-size: 24px; font-weight: 800; color: var(--primary); letter-spacing: -1px; }
        .logo span { color: var(--accent); }
        .btn-wa { background: #25d366; color: white; padding: 10px 18px; border-radius: 50px; text-decoration: none; font-weight: 700; font-size: 13px; }

        /* --- HERO --- */
        .hero { padding: 60px 6% 40px; text-align: center; }
        .hero h1 { font-size: clamp(2.4rem, 6vw, 4rem); color: var(--primary); font-weight: 800; line-height: 1.1; margin-bottom: 20px; }
        .hero p { color: #64748b; font-size: 1.1rem; max-width: 650px; margin: 0 auto 40px; }

        /* --- SIMULADOR MASTER --- */
        .sim-container {
            max-width: 1100px; margin: 0 auto; background: var(--white);
            border-radius: 40px; box-shadow: var(--shadow); overflow: hidden;
            display: flex; flex-direction: column; border: 1px solid #f1f5f9;
        }
        @media (min-width: 900px) { .sim-container { flex-direction: row; } }

        .sim-left { flex: 1.5; padding: 50px 40px; }
        .sim-right { 
            flex: 1; background: linear-gradient(145deg, var(--primary), #0a3311); 
            padding: 50px 40px; color: white; text-align: center;
            display: flex; flex-direction: column; justify-content: center;
        }

        .input-group { margin-bottom: 35px; }
        .label-row { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 12px; font-size: 15px; }
        
        input[type=range] {
            width: 100%; height: 8px; border-radius: 10px; background: #e2e8f0;
            -webkit-appearance: none; accent-color: var(--secondary); cursor: pointer;
        }

        .val-display { font-size: 22px; color: var(--secondary); font-weight: 800; }
        .price-main { font-size: 3.8rem; font-weight: 800; color: var(--accent); margin: 15px 0; letter-spacing: -2px; }

        .btn-main {
            width: 100%; background: var(--accent); color: var(--primary);
            padding: 22px; border-radius: 20px; border: none; font-weight: 800;
            font-size: 1.2rem; cursor: pointer; transition: 0.3s; margin-top: 20px;
        }
        .btn-main:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(192,202,51,0.3); }

        /* --- BENEFICIOS --- */
        .features { padding: 80px 6%; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .f-card { background: white; padding: 40px; border-radius: 30px; border: 1px solid #f1f5f9; transition: 0.3s; }
        .f-card:hover { border-color: var(--accent); transform: translateY(-5px); }
        .f-icon { font-size: 2rem; margin-bottom: 20px; display: block; }
        .f-card h3 { margin-bottom: 10px; color: var(--primary); }

        /* --- CATALOGO --- */
        .catalog { padding: 40px 6% 100px; text-align: center; }
        .c-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin-top: 50px; }
        .p-card { 
            background: white; border-radius: 30px; overflow: hidden; border: 1px solid #f1f5f9;
            transition: 0.4s; position: relative;
        }
        .p-card:hover { box-shadow: var(--shadow); transform: scale(1.02); }
        .p-img { height: 220px; background: #f8fafc; display: flex; align-items: center; justify-content: center; font-size: 5rem; }
        .p-info { padding: 30px; }
        .p-tag { background: #f1f8e9; color: var(--secondary); font-size: 11px; font-weight: 800; padding: 5px 12px; border-radius: 50px; }

        /* --- MODAL FORM --- */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15,23,42,0.9); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 2000; padding: 20px;
        }
        .modal-body {
            background: white; width: 100%; max-width: 550px; border-radius: 35px;
            padding: 45px; position: relative; animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .close-btn { position: absolute; top: 25px; right: 25px; cursor: pointer; font-size: 20px; font-weight: 800; color: #94a3b8; }
        
        .form-row { margin-bottom: 20px; }
        .form-row label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 14px; color: var(--primary); }
        .form-row input { width: 100%; padding: 15px; border-radius: 15px; border: 2px solid #f1f5f9; outline: none; font-size: 16px; }
        .form-row input:focus { border-color: var(--accent); }

        footer { background: #0a3311; color: white; padding: 80px 6% 40px; text-align: center; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">RJ<span>PRÉSTAMOS</span></div>
        <a href="https://wa.me/18299096655" class="btn-wa">Soporte WhatsApp</a>
    </nav>

    <header class="hero">
        <h1>Crédito Inteligente para <br> Dominicanos que Avanzan.</h1>
        <p>Tu dinero listo en 15 minutos. Sin papeleo físico, 100% digital y con la garantía de confianza de RJ Préstamos.</p>
        
        <div class="sim-container">
            <div class="sim-left">
                <div class="input-group">
                    <div class="label-row">
                        <span>¿Cuánto dinero necesitas?</span>
                        <span class="val-display">RD$ <span id="mVal">30,000</span></span>
                    </div>
                    <input type="range" id="mRange" min="5000" max="300000" step="5000" value="30000">
                </div>
                <div class="input-group">
                    <div class="label-row">
                        <span>¿En qué tiempo pagarás?</span>
                        <span class="val-display"><span id="pVal">12</span> Meses</span>
                    </div>
                    <input type="range" id="pRange" min="3" max="48" step="1" value="12">
                </div>
                <div style="text-align: left; display: flex; gap: 15px; margin-top: 10px;">
                    <span style="font-size: 12px; color: #94a3b8;">✔ Seguro incluido</span>
                    <span style="font-size: 12px; color: #94a3b8;">✔ Sin penalidad por abono</span>
                </div>
            </div>
            <div class="sim-right">
                <p style="font-weight: 600; opacity: 0.8; font-size: 15px;">CUOTA FIJA MENSUAL</p>
                <div class="price-main" id="res">RD$ 3,460</div>
                <button class="btn-main" onclick="openForm()">SOLICITAR DESEMBOLSO</button>
                <p style="margin-top: 20px; font-size: 12px; opacity: 0.6;">Sujeto a verificación de crédito básica.</p>
            </div>
        </div>
    </header>

    <section class="features">
        <div class="f-card">
            <span class="f-icon">🛡</span>
            <h3>Seguridad Total</h3>
            <p style="color: #64748b; font-size: 14px;">Protegemos tus datos con tecnología de encriptación bancaria de última generación.</p>
        </div>
        <div class="f-card">
            <span class="f-icon">⚡</span>
            <h3>Rapidez Extrema</h3>
            <p style="color: #64748b; font-size: 14px;">Olvídate de las filas. Recibe respuesta en tu WhatsApp en menos de lo que dura un café.</p>
        </div>
        <div class="f-card">
            <span class="f-icon">🇩🇴</span>
            <h3>Orgullo Local</h3>
            <p style="color: #64748b; font-size: 14px;">Servicio diseñado por dominicanos para dominicanos, entendiendo tus necesidades reales.</p>
        </div>
    </section>

    <section class="catalog">
        <h2 style="font-size: 2.2rem; color: var(--primary);">Nuestras Facilidades</h2>
        <div class="c-grid">
            <div class="p-card">
                <div class="p-img">🔊</div>
                <div class="p-info">
                    <span class="p-tag">EQUIPOS DE AUDIO</span>
                    <h3 style="margin: 10px 0;">Bocinas Profesionales</h3>
                    <p style="color: #64748b; font-size: 14px; margin-bottom: 20px;">Lleva el sonido a otro nivel con planes de pago diarios o semanales.</p>
                    <button class="btn-wa" style="width: 100%; display: block; background: var(--primary);" onclick="openForm()">Cotizar Plan</button>
                </div>
            </div>
            <div class="p-card">
                <div class="p-img">📺</div>
                <div class="p-info">
                    <span class="p-tag">HOGAR</span>
                    <h3 style="margin: 10px 0;">Smart TV 4K</h3>
                    <p style="color: #64748b; font-size: 14px; margin-bottom: 20px;">Financia el entretenimiento de tu familia con cuotas que no sientes.</p>
                    <button class="btn-wa" style="width: 100%; display: block; background: var(--primary);" onclick="openForm()">Cotizar Plan</button>
                </div>
            </div>
            <div class="p-card">
                <div class="p-img">📱</div>
                <div class="p-info">
                    <span class="p-tag">TECNOLOGÍA</span>
                    <h3 style="margin: 10px 0;">Móviles Último Modelo</h3>
                    <p style="color: #64748b; font-size: 14px; margin-bottom: 20px;">Mantente conectado con lo mejor del mercado sin descapitalizarte.</p>
                    <button class="btn-wa" style="width: 100%; display: block; background: var(--primary);" onclick="openForm()">Cotizar Plan</button>
                </div>
            </div>
        </div>
    </section>

    <div class="modal" id="modal">
        <div class="modal-body">
            <span class="close-btn" onclick="closeForm()">&times;</span>
            <h2 style="color: var(--primary); margin-bottom: 10px;">Solicitud de Crédito</h2>
            <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">Completa estos datos para una aprobación inmediata.</p>
            <form id="fullForm">
                <div class="form-row">
                    <label>Nombre Completo</label>
                    <input type="text" id="fname" placeholder="Nombre y Apellido" required>
                </div>
                <div class="form-row">
                    <label>Cédula de Identidad</label>
                    <input type="text" id="fcedula" placeholder="001-0000000-0" required>
                </div>
                <div class="form-row">
                    <label>WhatsApp</label>
                    <input type="tel" id="fphone" placeholder="829-000-0000" required>
                </div>
                <div class="form-row">
                    <label>Ocupación / Trabajo</label>
                    <input type="text" id="fjob" placeholder="Lugar de trabajo o negocio" required>
                </div>
                <button type="submit" class="btn-main">ENVIAR A REVISIÓN</button>
            </form>
        </div>
    </div>

    <footer>
        <h2 style="margin-bottom: 20px;">RJ PRÉSTAMOS</h2>
        <p style="opacity: 0.7; font-size: 14px; max-width: 500px; margin: 0 auto;">Ofreciendo soluciones financieras transparentes y rápidas para el desarrollo de cada familia en República Dominicana.</p>
        <div style="margin: 30px 0;">
            <p>Soporte: <strong>829-909-6655</strong></p>
            <p>Santo Domingo, República Dominicana</p>
        </div>
        <p style="font-size: 11px; opacity: 0.4;">© 2026 RJ Préstamos. Todos los derechos reservados. El uso de este sitio implica la aceptación de los términos de privacidad.</p>
    </footer>

    <script>
        const mR = document.getElementById('mRange');
        const pR = document.getElementById('pRange');
        const mV = document.getElementById('mVal');
        const pV = document.getElementById('pVal');
        const res = document.getElementById('res');
        const modal = document.getElementById('modal');

        function calculate() {
            const m = parseInt(mR.value);
            const p = parseInt(pR.value);
            mV.innerText = m.toLocaleString();
            pV.innerText = p;
            
            // Interés competitivo del 3.2% mensual aprox.
            const cuota = (m / p) + (m * 0.032);
            res.innerText = "RD$ " + Math.round(cuota).toLocaleString();
        }

        function openForm() { modal.style.display = 'flex'; }
        function closeForm() { modal.style.display = 'none'; }

        mR.addEventListener('input', calculate);
        pR.addEventListener('input', calculate);
        calculate();

        document.getElementById('fullForm').onsubmit = function(e) {
            e.preventDefault();
            const n = document.getElementById('fname').value;
            const c = document.getElementById('fcedula').value;
            const msg = `SOLICITUD WEB: Hola RJ Préstamos, soy ${n}, cédula ${c}. Solicito un préstamo de RD$ ${mV.innerText} por ${pV.innerText} meses. Espero su respuesta.`;
            window.location.href = "https://wa.me/18299096655?text=" + encodeURIComponent(msg);
        }
    </script>
</body>
</html>
